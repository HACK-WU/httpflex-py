[tool.setuptools.packages.find]
where = [ "src" ]

# ruff 配置

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".ruff_cache",
  ".venv",
  "__pypackages__",
  "build",
  "dist",
  "node_modules",
  "venv",
]

output-format = "full"
format.docstring-code-format = true

lint.select = [ "E4", "E7", "E9", "F", "UP" ]
lint.ignore = [
  "B904",
  "B905",
  "EM101",
  "EXE001",
  "G004",
  "ISC001",
  "PLC1901",
  "PLW060",
  "PLW2901",
  "PT011",
  "PT018",
  "RUF002",
  "RUF003",
  "RUF013",
  "S101",
  "S311",
  "SIM905",
  "SLF001",
  "UP038",
]
lint.extend-ignore = [ "E402" ]
lint.fixable = [ "ALL" ]
lint.extend-safe-fixes = [ "UP" ]
lint.mccabe.max-complexity = 17
lint.pylint.allow-magic-value-types = [ "float", "int", "str" ]
lint.pylint.max-args = 10
lint.pylint.max-branches = 20
lint.pylint.max-returns = 8
# pytest 配置
lint.pylint.max-statements = 88

[tool.pytest.ini_options]
pythonpath = [ "src" ]
# 仅收集 tests/ 下的单元测试（带覆盖率门禁）。
# 端到端真实请求测试位于同级的 tests_e2e/，使用独立配置运行：
#   uv run pytest tests_e2e -c tests_e2e/pytest.ini
# 二者通过 testpaths 与独立 pytest.ini 实现隔离，互不影响。
testpaths = [ "tests/" ]
python_files = [ "test_*.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]
markers = [
  "unit: 单元测试",
  "slow: 慢速测试（>1s）",
  "e2e: 端到端真实请求测试（依赖本地 Redis，运行于 tests_e2e/，不计入覆盖率）",
]
addopts = [
  "-v",
  "--tb=short",
  "--cov=httpflex",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-p",
  "no:warnings",
]

# 覆盖率配置

[tool.coverage.run]
source = [ "httpflex" ]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
