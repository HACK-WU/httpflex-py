[pytest]
# 端到端测试独立配置：不挂覆盖率门禁（依赖本地 Redis，且本身不度量 httpflex 覆盖率）
# 运行方式：uv run pytest tests_e2e -c tests_e2e/pytest.ini
testpaths = .
pythonpath = ../src ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: 慢速测试（>1s，如真实 Redis TTL / Celery worker）
addopts =
    -v
    --tb=short
    -p
    no:cacheprovider
    --color=yes
